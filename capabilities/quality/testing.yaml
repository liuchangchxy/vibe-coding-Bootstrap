id: testing
version: "2"
name: Testing
kind: workflow
description: Check observable behavior with focused, repeatable tests appropriate to the change.
status: draft
source: ../../docs/catalog-rules.md
category: quality
purpose: Check observable behavior with focused, repeatable tests appropriate to the change.
applicability:
  use_when:
  - Behavior changes need regression evidence.
  - An executable project needs a test organization convention.
  not_for:
  - A guarantee of correctness from coverage numbers alone.
maturity: experimental
maintainer: vibe-coding-bootstrap repository maintainers
last_reviewed: '2026-10-15'
requires: []
related_capabilities:
- debugging
- code-review
conflicts_with: []
components:
- id: reference
  kind: documentation
  role: Provide a concrete Python example of test organization and collection conventions.
  source_id: primary
- id: project-test-guidance
  kind: template
  role: Adaptable testing guidance for a single project.
  source_id: local-template
  assembly:
    id: project-test-guidance
    name: Project test guidance template
    type: template
    source: components/project/test-guidance.md
    provider: vibe-coding-bootstrap
    version: '1'
    scope: project
    delivery: copy
    destination: .vibe-coding-bootstrap/components/test-guidance.md
    optional: true
    provenance:
      repository_path: components/project/test-guidance.md
- id: codex-native-testing-skill
  kind: skill
  role: >-
    Repo-local Codex representation of the testing Capability. Native activation is managed by
    the Codex activation adapter and requires the verified Skill plus minimal AGENTS trigger contract.
  source_id: codex-native-testing
  assembly:
    id: codex-native-testing-skill
    name: Codex native testing Skill
    type: skill
    source: host_adapters/codex/skills/testing/SKILL.md
    provider: vibe-coding-bootstrap
    version: '1'
    scope: project
    delivery: reference
    optional: true
    provenance:
      repository_path: host_adapters/codex/skills/testing/SKILL.md
