- id: primary
  title: 'pytest: Good Integration Practices'
  uri: https://docs.pytest.org/en/stable/explanation/goodpractices.html
  relationship: reference
  accessed_on: '2026-10-15'
- id: local-template
  title: Project test guidance template
  uri: components/project/test-guidance.md
  relationship: reference
- id: codex-native-testing
  title: Bootstrap Codex native testing Skill
  uri: host_adapters/codex/skills/testing/SKILL.md
  relationship: reference
experience_ids:
  - exp-codex-testing-activation-v1
selection_hints:
  signals:
  - Regression risk or repeatable behavioral checks are relevant.
  constraints:
  - The referenced pytest component applies to Python; other stacks need a suitable component reference.
  - Test effort must reflect change impact.
  - Codex native activation is Host-specific. The Phase 9 verified v1 contract uses the repo-local testing Skill plus the exact minimal AGENTS trigger; use the activation adapter rather than generic materialization, and do not assume this contract applies to other Hosts or future Codex versions.
evidence:
  state: supported
  summary: Real project-use evidence supports the Codex-native testing activation projection only. It does not establish testing effectiveness across projects or Hosts; the Capability remains draft and experimental.
  references:
    - ../../experiences/verified/codex-testing-activation-v1.yaml
    - ../../examples/activation/codex/README.md
