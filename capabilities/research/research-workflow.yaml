  - An investigation or experiment must report provenance, outcomes, and limitations.
  not_for:
  - Automatic Experience extraction or copying private datasets into this catalog.
maturity: experimental
maintainer: vibe-coding-bootstrap repository maintainers
last_reviewed: '2026-10-15'
requires: []
related_capabilities:
- documentation
- planning
conflicts_with: []
components:
- id: reference
  kind: documentation
  role: Clarify reproducibility terms when describing evidence and methods.
  source_id: primary
component_sources:
- id: primary
  title: 'The Turing Way: Definitions'
  uri: https://book.the-turing-way.org/reproducible-research/overview/overview-definitions/
  relationship: reference
  accessed_on: '2026-10-15'
selection_hints:
  signals:
  - Claims depend on experiments, datasets, or reproducible methods.
  constraints:
  - A source reference is not evidence that this capability improved a real project.
  - Keep confidential inputs and project observations in their owning project.
evidence:
