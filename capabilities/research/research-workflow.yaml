id: research-workflow
version: "1"
name: Research workflow
kind: workflow
description: Preserve methods, inputs, and evidence so research findings can be examined and reproduced.
status: draft
source: ../../docs/catalog-rules.md
category: research
purpose: Preserve methods, inputs, and evidence so research findings can be examined and reproduced.
applicability:
