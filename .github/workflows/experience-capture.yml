name: Capture merged Experience candidate

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  capture:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true || github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Capture event and open a review PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/capture_merged_experience.py
