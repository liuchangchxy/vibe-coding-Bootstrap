name: Coordination Label Cleanup

on:
  issues:
    types: [closed]

permissions:
  contents: read
  issues: write

jobs:
  cleanup:
    name: Remove active coordination labels after Issue close
    runs-on: ubuntu-latest
    steps:
      - name: Remove active coordination labels and preserve terminal evidence
        uses: liuchangchxy/vibe-coding-control-plane/.github/actions/coordination-label-cleanup@b41e42896d83e000cc6ca23e8815c8c447f4d64a
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
