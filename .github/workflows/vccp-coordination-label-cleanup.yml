name: Coordination Label Cleanup

on:
  issues:
    types: [closed]

permissions:
  contents: read
  issues: write

jobs:
  cleanup:
    name: Remove active coordination labels after Issue close
    runs-on: ubuntu-latest
    steps:
      - name: Remove active coordination labels and preserve terminal evidence
        uses: liuchangchxy/vibe-coding-control-plane/.github/actions/coordination-label-cleanup@3c91ef381c02cbf0f1d81f3679ad51b404016847
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
