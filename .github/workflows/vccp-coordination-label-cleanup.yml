name: Coordination Label Cleanup

on:
  issues:
    types: [closed]

permissions:
  contents: read
  issues: write

jobs:
  cleanup:
    name: Remove active coordination labels after Issue close
    runs-on: ubuntu-latest
    steps:
      - name: Remove active coordination labels and preserve terminal evidence
        uses: liuchangchxy/vibe-coding-control-plane/.github/actions/coordination-label-cleanup@bcbab1e2ce90284a5c81ad7e7d40eafd81872691
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
