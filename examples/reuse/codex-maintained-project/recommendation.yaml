  - source: experiences/verified/codex-testing-activation-v1.yaml
    record:
      id: exp-codex-testing-activation-v1
      identity: exp-codex-testing-activation-v1
      title: Codex repo-local testing Skill requires the verified activation contract
      project_context:
        project_type: software-project
        goal: Verify that Bootstrap testing guidance is consumed by Codex through
          native repository surfaces.
        technologies:
        - Python
        - Codex CLI
        constraints:
        - Disposable acceptance fixture
        - Identical Control and Activated base state
        - Identical user prompt
        - Pilot marker isolated from the production Skill
      approach: Compared a Control repository with no repo-local testing Skill against
        an Activated repository using the same base and prompt. A Skill-only attempt
        did not emit the marker. The finalized repo-local Skill plus exact minimal
        AGENTS trigger was then exercised in the matched pilot.
      capability_ids:
      - testing
      context: Phase 9 exercised Codex CLI 0.162.0-alpha.17.2 against a disposable
        acceptance fixture. Both final A/B runs started at the same initial commit
        and used the identical prompt; the marker was isolated to the pilot copy and
        did not modify the production Skill.
      observation: Skill-only activation did not produce the acceptance marker. The
        complete Skill plus exact AGENTS trigger activation did produce the marker
        under otherwise matched A/B conditions.
      solution: For the tested Codex activation v1 contract, treat the repo-local
        testing Skill plus the exact minimal AGENTS trigger as the complete native
        activation state.
      scope:
      - codex
      - repo-local-skill
      - testing-capability
      - native-activation
      - codex-cli-0.162.0-alpha.17.2
      reasoning:
        interpretation: The observed Host behavior supports the current Codex activation
          adapter contract.
        limits:
        - A single Codex CLI version was directly exercised.
        - The A/B verifies Host consumption, not general testing effectiveness.
        - Future Codex behavior may change.
        - This result does not apply automatically to Claude, OpenCode, Gemini, or
          other Hosts.
        - It does not prove the AGENTS trigger is permanently required by all future
          Codex versions.
      outcome:
        summary: The finalized activation contract produced observable Codex Skill
          consumption in the controlled Phase 9 pilot.
        result: success
        measures:
        - name: control_marker_observed
          value: false
        - name: activated_marker_observed
          value: true
        - name: control_base_equals_activated_base
          value: true
        - name: prompt_identical
          value: true
      evidence:
      - type: project_result
        source: examples/activation/codex/control-result.json; examples/activation/codex/activated-result.json
        description: Matched Control and Activated evidence; Control marker absent
          and Activated marker present.
        strength: moderate
        verification:
          status: checked
          method: Compared the committed sanitized Phase 9 A/B summaries, base commit,
            prompt identity, and marker observations.
          verified_by: repository-maintainer
          verified_at: '2026-10-16T13:29:39Z'
        observed_at: '2026-10-16T13:29:39Z'
        limits:
        - One Codex CLI version and one disposable acceptance fixture.
        - Host Skill consumption does not establish general testing effectiveness.
      - type: reviewer_confirmation
        source: examples/activation/codex/README.md
        description: Phase 9 review confirmed the observed contract and its scope;
          this records repository evidence review and does not claim a new Codex CLI
          execution.
        strength: moderate
        verification:
          status: independently_confirmed
          method: Reviewed the Phase 9 acceptance summary and repository artifacts.
          verified_by: repository-maintainer
          verified_at: '2026-10-16T13:29:39Z'
        observed_at: '2026-10-16T13:29:39Z'
        limits:
