      - type: ci_result
        source: https://github.com/liuchangchxy/vibe-coding-Bootstrap/actions/runs/38893332854
        description: Phase 9 CI run 38893332854 recorded 92 passing tests after the
          activation-state repair; this checks implementation and state-contract regression,
          not the Host A/B itself.
        strength: moderate
